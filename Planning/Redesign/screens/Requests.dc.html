<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MYT friend requests</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#14111C}
a{color:#D4FF4F}a:hover{color:#E8FF9E}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.scroller{scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
@keyframes slide{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes glow{0%,100%{border-color:#2A2439}50%{border-color:#D4FF4F}}
@keyframes shimmer{from{background-position:-120px 0}to{background-position:120px 0}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
@keyframes heart{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-40px) scale(1.1);opacity:0}}
.slide{opacity:0;animation:slide .45s cubic-bezier(.2,.8,.2,1) forwards}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.glow{animation:glow 1.2s ease 1}
.pending{background:linear-gradient(90deg,#2A2439 0,#3A3350 50%,#2A2439 100%);background-size:240px 100%;animation:shimmer 1.4s linear infinite}
.wave{display:inline-block;transform-origin:70% 80%;animation:wave 2.4s ease-in-out infinite}
.heart{position:absolute;animation:heart 1s ease-out forwards}
.pill{transition:left .35s cubic-bezier(.3,1.3,.5,1)}
.btn{transition:transform .15s}
.btn:active{transform:scale(.92)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;opacity:1!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #14111C; color: #F5F2FA; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

<div style="padding: 20px 22px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px">
<a href="Meet.dc.html" aria-label="Back to Meet" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #F5F2FA">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<h1 class="disp" style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -1px">Friends</h1>
</div>
<div role="tablist" aria-label="Requests" style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #1F1A2B; border-radius: 16px; padding: 4px">
<span class="pill" aria-hidden="true" style="position: absolute; top: 4px; bottom: 4px; left: {{ pillLeft }}; width: calc(50% - 4px); border-radius: 12px; background: #F5F2FA"></span>
<button type="button" role="tab" aria-selected="{{ inSel }}" onClick="{{ showIn }}" style="position: relative; min-height: 44px; border: 0; background: transparent; font: 700 15px 'DM Sans', sans-serif; color: {{ inColor }}; cursor: pointer">Requests · {{ pendingCount }}</button>
<button type="button" role="tab" aria-selected="{{ outSel }}" onClick="{{ showOut }}" style="position: relative; min-height: 44px; border: 0; background: transparent; font: 700 15px 'DM Sans', sans-serif; color: {{ outColor }}; cursor: pointer">Sent · 2</button>
</div>
</div>

<div class="scroller" style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 22px 110px; display: flex; flex-direction: column; gap: 10px">

<sc-if value="{{ isIn }}" hint-placeholder-val="{{ true }}">
<sc-for list="{{ incoming }}" as="r" hint-placeholder-count="3">
<div class="slide" style="animation-delay: {{ r.delay }}; position: relative; background: #1F1A2B; border: 1.5px solid #2A2439; border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="position: relative; flex: none; width: 50px; height: 50px; border-radius: 50%; background: {{ r.color }}; color: #14111C; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center">{{ r.i }}
<span class="wave" aria-hidden="true" style="position: absolute; right: -6px; bottom: -4px; width: 24px; height: 24px; border-radius: 50%; background: #14111C; color: #FFD24F; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V6a1.5 1.5 0 0 1 3 0v4M10 10V4.5a1.5 1.5 0 0 1 3 0V10M13 10V5.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L4 14a1.5 1.5 0 0 1 2.5-1.7L7 13"></path></svg></span>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 700; font-size: 16px">{{ r.name }}</span>
<span style="font-size: 13px; color: #A9A1BC">{{ r.uni }} · {{ r.when }}</span>
</span>
</div>
<div style="font-size: 13px; color: #A9A1BC; background: #14111C; border-radius: 12px; padding: 9px 12px">{{ r.why }}</div>
<sc-if value="{{ r.open }}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" class="btn" onClick="{{ r.decline }}" style="min-height: 46px; border-radius: 14px; border: 1.5px solid #352E47; background: transparent; color: #F5F2FA; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">Not now</button>
<button type="button" class="btn" onClick="{{ r.accept }}" style="min-height: 46px; border-radius: 14px; border: 0; background: #D4FF4F; color: #14111C; font: 800 15px 'DM Sans', sans-serif; cursor: pointer">Accept</button>
</div>
</sc-if>
<sc-if value="{{ r.friends }}" hint-placeholder-val="{{ false }}">
<div class="glow" style="display: flex; align-items: center; gap: 10px; border: 1.5px solid #2A2439; border-radius: 14px; padding: 6px 6px 6px 12px">
<span class="pop" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #D4FF4F; color: #14111C; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<span style="flex: 1; font-weight: 700; font-size: 14px">You're friends now</span>
<a href="Chats.dc.html" style="min-height: 38px; padding: 0 14px; border-radius: 11px; background: #6EA8FF; color: #14111C; text-decoration: none; font-weight: 800; font-size: 14px; display: flex; align-items: center">Say hi</a>
<span aria-hidden="true" style="position: absolute; right: 60px; bottom: 40px; pointer-events: none">
<span class="heart" style="left: 0; color: #FF6FA8; font-size: 18px">♥</span>
<span class="heart" style="left: 18px; color: #D4FF4F; font-size: 14px; animation-delay: .15s">♥</span>
<span class="heart" style="left: -16px; color: #C79BFF; font-size: 12px; animation-delay: .3s">♥</span>
</span>
</div>
</sc-if>
<sc-if value="{{ r.declined }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #A9A1BC">Request hidden. They won't be told.
<button type="button" onClick="{{ r.undo }}" style="min-height: 40px; padding: 0 12px; border: 0; background: transparent; color: #D4FF4F; font: 700 14px 'DM Sans', sans-serif; cursor: pointer">Undo</button></div>
</sc-if>
</div>
</sc-for>

<h2 class="disp slide" style="animation-delay: .35s; margin: 12px 0 0; font-size: 18px; font-weight: 700">Going to the same plans</h2>
<sc-for list="{{ suggested }}" as="s" hint-placeholder-count="2">
<div class="slide" style="animation-delay: {{ s.delay }}; display: flex; align-items: center; gap: 12px; background: #1F1A2B; border-radius: 18px; padding: 10px 10px 10px 12px">
<span style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: {{ s.color }}; color: #14111C; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">{{ s.i }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 700; font-size: 15px">{{ s.name }}</span>
<span style="font-size: 12px; color: #A9A1BC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.plan }}</span>
</span>
<sc-if value="{{ s.sent }}" hint-placeholder-val="{{ false }}">
<span class="pop" style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D4FF4F; color: #D4FF4F; font-weight: 800; font-size: 14px; display: flex; align-items: center">Sent</span>
</sc-if>
<sc-if value="{{ s.notSent }}" hint-placeholder-val="{{ true }}">
<button type="button" class="btn" onClick="{{ s.add }}" style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 0; background: #F5F2FA; color: #14111C; font: 800 14px 'DM Sans', sans-serif; cursor: pointer">Add</button>
</sc-if>
</div>
</sc-for>
</sc-if>

<sc-if value="{{ isOut }}" hint-placeholder-val="{{ false }}">
<sc-for list="{{ outgoing }}" as="o" hint-placeholder-count="2">
<div class="slide" style="animation-delay: {{ o.delay }}; display: flex; align-items: center; gap: 12px; background: #1F1A2B; border-radius: 18px; padding: 12px">
<span style="flex: none; width: 46px; height: 46px; border-radius: 50%; background: {{ o.color }}; color: #14111C; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ o.i }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-weight: 700; font-size: 15px">{{ o.name }}</span>
<span class="pending" style="align-self: flex-start; font-size: 12px; font-weight: 700; color: #F5F2FA; padding: 3px 9px; border-radius: 999px">Waiting for a reply</span>
</span>
<button type="button" style="min-height: 40px; padding: 0 12px; border: 0; background: transparent; color: #A9A1BC; font: 700 14px 'DM Sans', sans-serif; cursor: pointer">Cancel</button>
</div>
</sc-for>
</sc-if>
</div>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 66px; box-sizing: border-box; padding: 6px; border-radius: 24px; background: rgba(31,26,43,.94); border: 1px solid #352E47; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; color: #A9A1BC; text-decoration: none; font-size: 11px; font-weight: 700">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
<a href="Meet.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; background: #D4FF4F; color: #14111C; text-decoration: none; font-size: 11px; font-weight: 800">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM12 12a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5zM8.5 17a3.5 3.5 0 0 1 7 0"></path></svg>Meet</a>
<a href="Chats.dc.html" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; color: #A9A1BC; text-decoration: none; font-size: 11px; font-weight: 700">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Chats
<span style="position: absolute; top: 4px; right: 18px; min-width: 16px; height: 16px; border-radius: 999px; background: #FF6FA8; color: #14111C; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">5</span></a>
<a href="Plans.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; color: #A9A1BC; text-decoration: none; font-size: 11px; font-weight: 700">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>Plans</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'in', status: {}, sent: {} };
  }
  renderVals() {
    var self = this;
    var st = this.state.status;
    function setStatus(id, v) {
      var next = Object.assign({}, self.state.status);
      next[id] = v;
      self.setState({ status: next });
    }
    var incoming = [
      { id: 'maya', i: 'MR', name: 'Maya Rahman', uni: "King's", when: '2h ago', color: '#6EA8FF', why: 'You both said yes to Arsenal Women v London City' },
      { id: 'amara', i: 'AO', name: 'Amara Okafor', uni: 'Goldsmiths', when: 'Yesterday', color: '#FFD24F', why: 'Into cinema + football · free weekend evenings' },
      { id: 'elliot', i: 'EB', name: 'Elliot Brooks', uni: 'LSE', when: 'Yesterday', color: '#4FE3C1', why: 'Also going to Tottenham v Ipswich' }
    ].map(function (r, n) {
      var s = st[r.id] || 'open';
      return Object.assign({}, r, {
        delay: (n * 0.08 + 0.05).toFixed(2) + 's',
        open: s === 'open', friends: s === 'friends', declined: s === 'declined',
        accept: function () { setStatus(r.id, 'friends'); },
        decline: function () { setStatus(r.id, 'declined'); },
        undo: function () { setStatus(r.id, 'open'); }
      });
    });
    var suggested = [
      { id: 'leo', i: 'LM', name: 'Leo Mensah', color: '#FF9A4D', plan: 'Indoor karting, East London' },
      { id: 'priya', i: 'PS', name: 'Priya Shah', color: '#C79BFF', plan: 'East London cinema night' }
    ].map(function (s, n) {
      var sent = !!self.state.sent[s.id];
      return Object.assign({}, s, {
        delay: (n * 0.08 + 0.4).toFixed(2) + 's', sent: sent, notSent: !sent,
        add: function () { var next = Object.assign({}, self.state.sent); next[s.id] = true; self.setState({ sent: next }); }
      });
    });
    var outgoing = [
      { i: 'NC', name: 'Noah Chen', color: '#C79BFF' },
      { i: 'SK', name: 'Sana Khan', color: '#FF6FA8' }
    ].map(function (o, n) { return Object.assign({}, o, { delay: (n * 0.08).toFixed(2) + 's' }); });
    var isIn = this.state.tab === 'in';
    return {
      isIn: isIn, isOut: !isIn,
      inSel: isIn ? 'true' : 'false', outSel: isIn ? 'false' : 'true',
      inColor: isIn ? '#14111C' : '#A9A1BC', outColor: isIn ? '#A9A1BC' : '#14111C',
      pillLeft: isIn ? '4px' : '50%',
      showIn: function () { self.setState({ tab: 'in' }); },
      showOut: function () { self.setState({ tab: 'out' }); },
      pendingCount: incoming.filter(function (r) { return r.open; }).length,
      incoming: incoming, suggested: suggested, outgoing: outgoing
    };
  }
}
</script>
</body>
</html>
