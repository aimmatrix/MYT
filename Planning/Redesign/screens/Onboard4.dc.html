<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MYT finding your people</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#14111C}
a{color:#D4FF4F}a:hover{color:#E8FF9E}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
@keyframes fill{from{width:80%}}
@keyframes inA{from{transform:translate(-150px,-170px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes inB{from{transform:translate(160px,-140px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes inC{from{transform:translate(-170px,120px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes inD{from{transform:translate(150px,160px) scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.9);opacity:0}}
@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-40}}
.fill{animation:fill .9s cubic-bezier(.3,1.3,.5,1) .2s both}
.inA{animation:inA 1.1s cubic-bezier(.2,.9,.3,1.2) .3s both}
.inB{animation:inB 1.1s cubic-bezier(.2,.9,.3,1.2) .5s both}
.inC{animation:inC 1.1s cubic-bezier(.2,.9,.3,1.2) .7s both}
.inD{animation:inD 1.1s cubic-bezier(.2,.9,.3,1.2) .9s both}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid #D4FF4F;animation:ring 2.4s ease-out infinite}
.beat{animation:heartbeat 1.8s ease-in-out infinite}
.rise{opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.spin{animation:spin .9s linear infinite}
.link{stroke-dasharray:4 6;animation:dash 1.2s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;opacity:1!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #14111C; color: #F5F2FA; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 22px 26px">

<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 13px; font-weight: 700; color: #A9A1BC">5 of 5</span>
<span style="flex: 1; height: 6px; border-radius: 999px; background: #2A2439; overflow: hidden"><span class="fill" style="display: block; height: 100%; width: 100%; background: #D4FF4F; border-radius: 999px"></span></span>
</div>

<div aria-hidden="true" style="position: relative; height: 330px; margin-top: 10px">
<svg viewBox="0 0 346 330" style="position: absolute; inset: 0; width: 100%; height: 100%">
<path class="link" d="M70 70 L173 165" stroke="#6EA8FF" stroke-width="2" fill="none"></path>
<path class="link" d="M282 86 L173 165" stroke="#FF9A4D" stroke-width="2" fill="none"></path>
<path class="link" d="M62 262 L173 165" stroke="#C79BFF" stroke-width="2" fill="none"></path>
<path class="link" d="M286 258 L173 165" stroke="#4FE3C1" stroke-width="2" fill="none"></path>
</svg>
<div style="position: absolute; left: 50%; top: 50%; width: 112px; height: 112px; margin: -53px 0 0 -56px">
<span class="ring"></span><span class="ring" style="animation-delay: .8s"></span><span class="ring" style="animation-delay: 1.6s"></span>
<div class="beat" style="position: absolute; inset: 0; border-radius: 50%; background: #D4FF4F; color: #14111C; display: flex; flex-direction: column; align-items: center; justify-content: center">
<span class="disp" style="font-size: 34px; font-weight: 800; line-height: 1">A</span>
<span style="font-size: 11px; font-weight: 800">YOU</span>
</div>
</div>
<div class="inA" style="position: absolute; left: 40px; top: 40px; width: 60px; height: 60px; border-radius: 50%; background: #6EA8FF; color: #14111C; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 17px">MR</div>
<div class="inB" style="position: absolute; left: 256px; top: 60px; width: 52px; height: 52px; border-radius: 50%; background: #FF9A4D; color: #14111C; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 15px">LM</div>
<div class="inC" style="position: absolute; left: 34px; top: 234px; width: 56px; height: 56px; border-radius: 50%; background: #C79BFF; color: #14111C; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 16px">PS</div>
<div class="inD" style="position: absolute; left: 258px; top: 230px; width: 56px; height: 56px; border-radius: 50%; background: #4FE3C1; color: #14111C; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 16px">NC</div>
</div>

<div role="status" aria-live="polite" style="text-align: center">
<h1 class="disp" style="margin: 0; font-size: 30px; line-height: 1.08; font-weight: 800; letter-spacing: -1px">{{ headline }}</h1>
<p style="margin: 6px 0 0; font-size: 15px; color: #A9A1BC">{{ sub }}</p>
</div>

<ul style="list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
<li class="rise" style="animation-delay: {{ s.delay }}; display: flex; align-items: center; gap: 12px; background: #1F1A2B; border-radius: 16px; padding: 12px 14px; font-size: 15px; font-weight: 600; color: {{ s.color }}">
<sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}">
<span class="pop" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #D4FF4F; color: #14111C; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
</sc-if>
<sc-if value="{{ s.busy }}" hint-placeholder-val="{{ true }}">
<span class="spin" aria-hidden="true" style="flex: none; width: 22px; height: 22px; margin: 2px; border-radius: 50%; border: 3px solid #352E47; border-top-color: #D4FF4F; box-sizing: border-box"></span>
</sc-if>
<sc-if value="{{ s.wait }}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; border: 2px dashed #4A4160; box-sizing: border-box"></span>
</sc-if>
{{ s.label }}
</li>
</sc-for>
</ul>

<sc-if value="{{ ready }}" hint-placeholder-val="{{ false }}">
<a href="Discover.dc.html" class="rise" style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 20px; background: #D4FF4F; color: #14111C; text-decoration: none; font-weight: 800; font-size: 17px; box-shadow: 0 6px 0 #8FB32A">
<span class="disp">Let's go</span>
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  componentDidMount() {
    var self = this;
    this.timer = setInterval(function () {
      if (self.state.step >= 3) { clearInterval(self.timer); return; }
      self.setState({ step: self.state.step + 1 });
    }, 1100);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    var step = this.state.step;
    var labels = ['Reading your free time', 'Finding plans that fit', 'Matching you with students'];
    var steps = labels.map(function (l, i) {
      return {
        label: l, delay: (i * 0.12 + 0.4).toFixed(2) + 's',
        done: step > i, busy: step === i, wait: step < i,
        color: step >= i ? '#F5F2FA' : '#7E7694'
      };
    });
    var ready = step >= 3;
    return {
      steps: steps,
      ready: ready,
      headline: ready ? 'Your people are here' : 'Finding your people…',
      sub: ready ? 'Students who like what you like and are free when you are.' : 'This only takes a moment.'
    };
  }
}
</script>
</body>
</html>
