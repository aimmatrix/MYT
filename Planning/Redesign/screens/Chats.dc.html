<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MYT chats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#14111C}
a{color:#D4FF4F}a:hover{color:#E8FF9E}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.scroller{scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes banner{0%{opacity:0;transform:translateY(-16px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes sparkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
.ringspin{animation:spin 6s linear infinite}
.banner{animation:banner .6s cubic-bezier(.3,1.4,.5,1) .3s both}
.rise{opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#D4FF4F;animation:typing 1.2s ease-in-out infinite}
.bump{animation:bump 1.8s ease-in-out infinite}
.sparkle{position:absolute;animation:sparkle 2s ease-in-out infinite}
.row{transition:background .2s,transform .15s}
.row:hover{background:#1F1A2B}
.row:active{transform:scale(.98)}
.pill{transition:left .35s cubic-bezier(.3,1.3,.5,1)}
.story{transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.story:hover{transform:translateY(-3px) rotate(-3deg)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;opacity:1!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #14111C; color: #F5F2FA; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

<div style="padding: 20px 22px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 class="disp" style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -1px">Chats</h1>
<button type="button" aria-label="New chat" style="width: 46px; height: 46px; border-radius: 15px; border: 0; background: #D4FF4F; color: #14111C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div role="tablist" aria-label="Chat type" style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #1F1A2B; border-radius: 16px; padding: 4px">
<span class="pill" aria-hidden="true" style="position: absolute; top: 4px; bottom: 4px; left: {{ pillLeft }}; width: calc(33.333% - 2.67px); border-radius: 12px; background: #F5F2FA"></span>
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{ t.aria }}" onClick="{{ t.pick }}" style="position: relative; min-height: 42px; border: 0; background: transparent; font: 700 14px 'DM Sans', sans-serif; color: {{ t.color }}; cursor: pointer; transition: color .3s">{{ t.label }}</button>
</sc-for>
</div>
</div>

<div class="scroller" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 0 110px">

<sc-if value="{{ showBanner }}" hint-placeholder-val="{{ true }}">
<div class="banner" role="status" style="position: relative; margin: 0 22px 16px; background: #6EA8FF; color: #14111C; border-radius: 22px; padding: 14px 14px 14px 16px; display: flex; gap: 12px; align-items: flex-start; overflow: hidden">
<span aria-hidden="true" class="sparkle" style="right: 54px; top: 10px; width: 10px; height: 10px; background: #14111C; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%)"></span>
<span aria-hidden="true" class="sparkle" style="right: 80px; bottom: 12px; width: 7px; height: 7px; background: #14111C; animation-delay: .7s; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%)"></span>
<span style="flex: none; width: 40px; height: 40px; border-radius: 13px; background: #14111C; color: #6EA8FF; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0zM12 7.5l4 2.9-1.5 4.6h-5L8 10.4z"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 800; font-size: 15px">You've been added to a group</span>
<span style="font-size: 13px; line-height: 1.35">You tapped "I'm interested" on Arsenal Women v London City, so you're in the chat with 3 others.</span>
</span>
<button type="button" onClick="{{ hideBanner }}" aria-label="Dismiss" style="flex: none; width: 32px; height: 32px; border-radius: 10px; border: 0; background: rgba(20,17,28,.15); color: #14111C; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</sc-if>

<sc-if value="{{ showStories }}" hint-placeholder-val="{{ true }}">
<div style="padding: 0 22px 8px; font-size: 13px; font-weight: 700; color: #A9A1BC; text-transform: uppercase; letter-spacing: 1px">Your activity groups</div>
<div class="scroller" style="display: flex; gap: 14px; overflow-x: auto; padding: 4px 22px 16px">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
<a href="GroupChat.dc.html" class="story" style="flex: none; width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #F5F2FA">
<span style="position: relative; width: 68px; height: 68px">
<sc-if value="{{ g.unread }}" hint-placeholder-val="{{ true }}">
<svg class="ringspin" viewBox="0 0 68 68" aria-hidden="true" style="position: absolute; inset: 0; width: 68px; height: 68px"><circle cx="34" cy="34" r="32" fill="none" stroke="{{ g.color }}" stroke-width="3" stroke-dasharray="12 6" stroke-linecap="round"></circle></svg>
</sc-if>
<span style="position: absolute; inset: 7px; border-radius: 18px; background: {{ g.color }}; color: #14111C; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ g.icon }}"></path></svg></span>
</span>
<span style="font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2">{{ g.short }}</span>
</a>
</sc-for>
</div>
</sc-if>

<ul style="list-style: none; margin: 0; padding: 0 10px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
<li class="rise" style="animation-delay: {{ r.delay }}">
<a href="GroupChat.dc.html" class="row" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 18px; text-decoration: none; color: #F5F2FA">
<span style="position: relative; flex: none; width: 52px; height: 52px; border-radius: {{ r.radius }}; background: {{ r.color }}; color: #14111C; font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ r.isGroup }}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.icon }}"></path></svg>
</sc-if>
<sc-if value="{{ r.isDm }}" hint-placeholder-val="{{ false }}">{{ r.i }}</sc-if>
<sc-if value="{{ r.online }}" hint-placeholder-val="{{ false }}">
<span style="position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; border-radius: 50%; background: #D4FF4F; border: 3px solid #14111C"></span>
</sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="flex: 1; min-width: 0; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.name }}</span>
<span style="flex: none; font-size: 12px; color: {{ r.timeColor }}">{{ r.time }}</span>
</span>
<span style="display: flex; align-items: center; gap: 8px">
<sc-if value="{{ r.typing }}" hint-placeholder-val="{{ false }}">
<span style="flex: 1; font-size: 13px; color: #D4FF4F; display: flex; align-items: center; gap: 6px">{{ r.typer }} is typing <span class="typing" aria-hidden="true" style="display: inline-flex; gap: 3px"><span></span><span style="animation-delay: .15s"></span><span style="animation-delay: .3s"></span></span></span>
</sc-if>
<sc-if value="{{ r.notTyping }}" hint-placeholder-val="{{ true }}">
<span style="flex: 1; min-width: 0; font-size: 13px; color: {{ r.msgColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.msg }}</span>
</sc-if>
<sc-if value="{{ r.hasUnread }}" hint-placeholder-val="{{ false }}">
<span class="bump" style="flex: none; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #D4FF4F; color: #14111C; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{ r.unread }}</span>
</sc-if>
</span>
</span>
</a>
</li>
</sc-for>
</ul>
</div>

<nav aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 66px; box-sizing: border-box; padding: 6px; border-radius: 24px; background: rgba(31,26,43,.94); border: 1px solid #352E47; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
<a href="Discover.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; color: #A9A1BC; text-decoration: none; font-size: 11px; font-weight: 700">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18zM15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
<a href="Meet.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; color: #A9A1BC; text-decoration: none; font-size: 11px; font-weight: 700">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM12 12a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5zM8.5 17a3.5 3.5 0 0 1 7 0"></path></svg>Meet</a>
<a href="Chats.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; background: #D4FF4F; color: #14111C; text-decoration: none; font-size: 11px; font-weight: 800">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Chats</a>
<a href="Plans.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 18px; color: #A9A1BC; text-decoration: none; font-size: 11px; font-weight: 700">
<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg>Plans</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', banner: true };
  }
  renderVals() {
    var self = this;
    var I = {
      football: 'M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0zM12 7.5l4 2.9-1.5 4.6h-5L8 10.4z',
      karting: 'M5 21V4M5 4h12l-2 4 2 4H5',
      cinema: 'M4 6h16v12H4zM8 6v12M16 6v12M4 10h4M4 14h4M16 10h4M16 14h4',
      social: 'M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8a4 4 0 0 0 0 8zM22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8'
    };
    var groups = [
      { short: 'Arsenal Women', color: '#6EA8FF', icon: I.football, unread: true },
      { short: 'Karting East', color: '#FF9A4D', icon: I.karting, unread: true },
      { short: 'Cinema night', color: '#C79BFF', icon: I.cinema, unread: false },
      { short: 'Matcha walk', color: '#4FE3C1', icon: I.social, unread: false }
    ];
    var all = [
      { kind: 'group', name: 'Arsenal Women v London City', icon: I.football, color: '#6EA8FF', msg: 'Leo: meet by the main exit at 4?', time: 'now', unread: 3, typing: true, typer: 'Maya' },
      { kind: 'group', name: 'Indoor karting, East London', icon: I.karting, color: '#FF9A4D', msg: 'Noah: Saturday has the most votes', time: '12m', unread: 2 },
      { kind: 'dm', name: 'Maya Rahman', i: 'MR', color: '#6EA8FF', msg: 'haha yes, see you Sunday', time: '1h', online: true },
      { kind: 'group', name: 'East London cinema night', icon: I.cinema, color: '#C79BFF', msg: 'Priya: anyone seen the new listings?', time: '3h' },
      { kind: 'dm', name: 'Priya Shah', i: 'PS', color: '#C79BFF', msg: 'You: do you prefer Fri or Sun?', time: 'Thu' },
      { kind: 'dm', name: 'Elliot Brooks', i: 'EB', color: '#4FE3C1', msg: 'You are now friends. Say hi!', time: 'Wed', fresh: true }
    ];
    var tab = this.state.tab;
    var rows = all.filter(function (r) {
      return tab === 'all' || (tab === 'groups' && r.kind === 'group') || (tab === 'friends' && r.kind === 'dm');
    }).map(function (r, n) {
      return Object.assign({}, r, {
        delay: (n * 0.06 + 0.2).toFixed(2) + 's',
        isGroup: r.kind === 'group', isDm: r.kind === 'dm',
        radius: r.kind === 'group' ? '16px' : '50%',
        typing: !!r.typing, notTyping: !r.typing,
        hasUnread: !!r.unread, unread: r.unread || 0,
        online: !!r.online,
        msgColor: r.unread ? '#F5F2FA' : r.fresh ? '#D4FF4F' : '#A9A1BC',
        timeColor: r.unread ? '#D4FF4F' : '#7E7694'
      });
    });
    var defs = [{ id: 'all', label: 'All' }, { id: 'groups', label: 'Groups' }, { id: 'friends', label: 'Friends' }];
    var idx = defs.map(function (d) { return d.id; }).indexOf(tab);
    return {
      tabs: defs.map(function (d) {
        var on = d.id === tab;
        return { label: d.label, aria: on ? 'true' : 'false', color: on ? '#14111C' : '#A9A1BC', pick: function () { self.setState({ tab: d.id }); } };
      }),
      pillLeft: idx === 0 ? '4px' : 'calc(' + (idx * 33.333) + '% + ' + (4 - idx * 2.67).toFixed(2) + 'px)',
      showBanner: this.state.banner && tab !== 'friends',
      hideBanner: function () { self.setState({ banner: false }); },
      showStories: tab !== 'friends',
      groups: groups,
      rows: rows
    };
  }
}
</script>
</body>
</html>
