<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MYT pick your uni</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#14111C}
a{color:#D4FF4F}a:hover{color:#E8FF9E}
.disp{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.scroller{scrollbar-width:none}.scroller::-webkit-scrollbar{display:none}
@keyframes fill{from{width:20%}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4) rotate(-30deg)}60%{transform:scale(1.2) rotate(8deg)}100%{transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(1.6) rotate(-12deg)}100%{opacity:1;transform:rotate(-6deg)}}
.fill{animation:fill .9s cubic-bezier(.3,1.3,.5,1) .2s both}
.rise{opacity:0;animation:rise .5s cubic-bezier(.2,.8,.2,1) forwards}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.stamp{animation:stamp .45s cubic-bezier(.3,1.5,.5,1) both}
.uni{transition:transform .15s,background .2s,border-color .2s}
.uni:hover{transform:translateX(3px)}
.uni:active{transform:scale(.98)}
.seg{transition:background .2s,color .2s,transform .15s}
.seg:active{transform:scale(.94)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;opacity:1!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #14111C; color: #F5F2FA; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 22px 26px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Onboard1.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: #F5F2FA">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<span style="font-size: 13px; font-weight: 700; color: #A9A1BC">2 of 5</span>
<span style="flex: 1; height: 6px; border-radius: 999px; background: #2A2439; overflow: hidden"><span class="fill" style="display: block; height: 100%; width: 40%; background: #D4FF4F; border-radius: 999px"></span></span>
</div>

<h1 class="disp rise" style="margin: 14px 0 6px; font-size: 32px; line-height: 1.05; font-weight: 800; letter-spacing: -1px">Where do you study?</h1>
<p class="rise" style="margin: 0 0 14px; font-size: 15px; color: #A9A1BC; animation-delay: .05s">You'll see students from every London uni, with yours first.</p>

<label class="rise" style="animation-delay: .1s; display: flex; align-items: center; gap: 10px; background: #1F1A2B; border: 2px solid #2A2439; border-radius: 16px; padding: 0 14px; min-height: 50px">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#A9A1BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14a7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
<span class="visually-hidden" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search universities</span>
<input value="{{ q }}" onChange="{{ onQ }}" placeholder="Search universities" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #F5F2FA; font: 500 16px 'DM Sans', sans-serif">
</label>

<div class="scroller" role="radiogroup" aria-label="University" style="flex: 1; min-height: 0; overflow-y: auto; margin: 12px -4px 0; padding: 0 4px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{ unis }}" as="u" hint-placeholder-count="6">
<button type="button" role="radio" aria-checked="{{ u.aria }}" class="uni rise" onClick="{{ u.pick }}" style="animation-delay: {{ u.delay }}; flex: none; position: relative; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border-radius: 18px; border: 2px solid {{ u.border }}; background: {{ u.bg }}; color: #F5F2FA; text-align: left; font: inherit; cursor: pointer">
<span style="flex: none; width: 38px; height: 38px; border-radius: 12px; background: {{ u.color }}; color: #14111C; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">{{ u.short }}</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-weight: 700; font-size: 15px">{{ u.name }}</span>
<span style="font-size: 12px; color: #A9A1BC">{{ u.count }} on MYT</span>
</span>
<sc-if value="{{ u.on }}" hint-placeholder-val="{{ false }}">
<span class="pop" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #D4FF4F; color: #14111C; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
</sc-if>
</button>
</sc-for>
</div>

<fieldset style="border: 0; margin: 14px 0 0; padding: 0; min-width: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 700; color: #A9A1BC; text-transform: uppercase; letter-spacing: 1px">Year</legend>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; background: #1F1A2B; border-radius: 16px; padding: 5px">
<sc-for list="{{ years }}" as="y" hint-placeholder-count="4">
<button type="button" class="seg" aria-pressed="{{ y.aria }}" onClick="{{ y.pick }}" style="min-height: 44px; border: 0; border-radius: 12px; background: {{ y.bg }}; color: {{ y.fg }}; font: 700 14px 'DM Sans', sans-serif; cursor: pointer">{{ y.label }}</button>
</sc-for>
</div>
</fieldset>

<div style="position: relative; margin-top: 16px">
<sc-if value="{{ hasPick }}" hint-placeholder-val="{{ true }}">
<span class="stamp" aria-hidden="true" style="position: absolute; right: 6px; top: -22px; z-index: 2; background: #FF6FA8; color: #14111C; font-weight: 800; font-size: 12px; padding: 5px 10px; border-radius: 999px">{{ stampText }}</span>
</sc-if>
<a href="Onboard3.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 20px; background: #D4FF4F; color: #14111C; text-decoration: none; font-weight: 800; font-size: 17px; box-shadow: 0 6px 0 #8FB32A">
<span class="disp">Continue</span>
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { uni: 'mdx', year: '2nd', q: '' };
  }
  renderVals() {
    var self = this;
    var all = [
      { id: 'mdx', short: 'MDX', name: 'Middlesex University', color: '#FF6FA8', count: '[COUNT]' },
      { id: 'kcl', short: 'KCL', name: "King's College London", color: '#6EA8FF', count: '[COUNT]' },
      { id: 'ucl', short: 'UCL', name: 'University College London', color: '#C79BFF', count: '[COUNT]' },
      { id: 'icl', short: 'ICL', name: 'Imperial College London', color: '#4FE3C1', count: '[COUNT]' },
      { id: 'qm', short: 'QM', name: 'Queen Mary University of London', color: '#FF9A4D', count: '[COUNT]' },
      { id: 'gold', short: 'GS', name: 'Goldsmiths, University of London', color: '#FFD24F', count: '[COUNT]' },
      { id: 'lse', short: 'LSE', name: 'London School of Economics', color: '#6EA8FF', count: '[COUNT]' }
    ];
    var q = this.state.q.trim().toLowerCase();
    var picked = null;
    var unis = all.filter(function (u) { return !q || (u.name + ' ' + u.short).toLowerCase().indexOf(q) !== -1; }).map(function (u, n) {
      var on = self.state.uni === u.id;
      if (on) picked = u;
      return Object.assign({}, u, {
        on: on, aria: on ? 'true' : 'false',
        bg: on ? 'rgba(212,255,79,.08)' : '#1F1A2B',
        border: on ? '#D4FF4F' : '#1F1A2B',
        delay: (n * 0.05 + 0.15).toFixed(2) + 's',
        pick: function () { self.setState({ uni: u.id }); }
      });
    });
    var years = ['1st', '2nd', '3rd+', 'Postgrad'].map(function (y) {
      var on = self.state.year === y;
      return { label: y, aria: on ? 'true' : 'false', bg: on ? '#F5F2FA' : 'transparent', fg: on ? '#14111C' : '#A9A1BC',
        pick: function () { self.setState({ year: y }); } };
    });
    return {
      q: this.state.q,
      onQ: function (e) { self.setState({ q: e.target.value }); },
      unis: unis,
      years: years,
      hasPick: !!picked,
      stampText: picked ? picked.short + ' · ' + (this.state.year === 'Postgrad' ? 'Postgrad' : this.state.year + ' year') : ''
    };
  }
}
</script>
</body>
</html>
